<div class="main-stack">
  <div class="window">
    <div class="titlebar">
      <span class="titlebar-label">XtremeTech</span>
    </div>

    <div class="content">
      <div id="loginView">
        <h1 class="heading">Sign in</h1>
        <p class="subtext">Enter your credentials to access the console.</p>

        <div id="formError" class="error-msg"></div>

        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="pw-toggle" id="pwToggle">show</button>
            </div>
          </div>

          <div class="field">
            <label for="captchaInput">Security check</label>
            <div class="captcha-row">
              <canvas id="captchaCanvas" width="140" height="46" title="Click to refresh"></canvas>
              <button type="button" class="captcha-refresh" id="captchaRefresh" title="Generate new code">↻</button>
            </div>
            <input type="text" id="captchaInput" class="captcha-input" placeholder="Type the code above" autocomplete="off">
          </div>

          <button type="submit" class="submit" id="submitBtn">
            <span class="spinner" id="spinner"></span>
            <span id="submitLabel">Sign in</span>
          </button>
        </form>
      </div>

      <div id="loggedInView" class="logged-in">
        <p class="status">Logged in</p>
        <button type="button" class="signout" id="signOutBtn">Sign out</button>
      </div>

      <div id="adminView" style="display:none;">
        <h1 class="heading">Admin Panel</h1>
        <p class="subtext">You're in.</p>
      </div>
    </div>
  </div>
</div>
