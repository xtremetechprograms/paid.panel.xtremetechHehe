<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XtremeTech</title>
<script>
(function(l){
  var keep = /\.github\.io$/.test(l.hostname) ? 1 : 0;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
})(window.location);
</script>
</head>
<body></body>
</html>
