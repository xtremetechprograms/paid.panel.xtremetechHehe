<!-- Startup section: docker image + startup command, and egg variables -->
<div class="manage-view" id="startupOverlay">
  <h1 class="heading" style="text-align:left; justify-content:flex-start;">Startup</h1>
  <p class="subtext" style="text-align:left; margin-bottom:16px;">Startup command, Docker image, and install variables for this server.</p>

  <div id="startupError" class="error-msg"></div>

  <div style="background:#0a0b0d; border:1px solid var(--panel-border); border-radius:10px; padding:16px; margin-bottom:20px;">
    <div class="field">
      <label for="startupCommandInput">Startup Command</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="startupCommandInput" style="flex:1; font-family:var(--mono); font-size:12.5px;">
        <button type="button" id="startupCopyBtn" title="Copy" style="flex-shrink:0; background:transparent; border:1px solid var(--panel-border); border-radius:10px; padding:9px 12px; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M15 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v7.5A1.5 1.5 0 0 0 6 15h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="field" style="margin-top:16px;">
      <label for="startupImageSelect">Available Docker Images</label>
      <select id="startupImageSelect" style="width:100%; background:#0a0b0d; border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:12.5px;"></select>
    </div>
  </div>

  <div style="background:#0a0b0d; border:1px solid var(--panel-border); border-radius:10px; padding:16px;">
    <h1 class="heading" style="text-align:left; justify-content:flex-start; font-size:16px; margin-bottom:4px;">Variables</h1>
    <div id="startupVarsBox"></div>
  </div>

  <button type="button" class="submit" id="startupSaveBtn" style="margin-top:20px;">
    <span>Save</span>
  </button>
</div>
