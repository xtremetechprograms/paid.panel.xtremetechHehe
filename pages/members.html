<div class="manage-view" id="membersOverlay">
  <h1 class="heading" style="text-align:left; justify-content:flex-start;">Manage Members</h1>
  <div class="plg-status" id="mmStatus"></div>
  <div class="mm-tabs" id="mmTabs">
    <button type="button" class="mm-tab active" data-tab="whitelist">Whitelist</button>
    <button type="button" class="mm-tab" data-tab="ops">Operators</button>
    <button type="button" class="mm-tab" data-tab="banned">Banned Players</button>
    <button type="button" class="mm-tab" data-tab="bannedIps">Banned IPs</button>
    <button type="button" class="mm-tab" data-tab="known">Members</button>
  </div>
  <div class="mm-bar" id="mmBar" style="display:none;">
    <input type="text" id="mmInput" autocomplete="off" spellcheck="false">
    <button type="button" class="plg-btn" id="mmAdd">Add</button>
  </div>
  <div class="mm-grid" id="mmPick"></div>
  <p class="mm-sub" id="mmListTitle"></p>
  <div class="mm-grid" id="mmList"></div>
</div>
