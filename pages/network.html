<div class="manage-view" id="networkOverlay">
  <h1 class="heading" style="text-align:left; justify-content:flex-start;">Network</h1>
  <p class="subtext" style="text-align:left; margin-bottom:16px;">Connection details for this server. Click a box to copy it.</p>
  <div class="net-row">
    <div class="net-box net-ip" id="netIp" role="button" tabindex="0" title="Copy IP"><span class="net-label">IP</span><span class="net-val" id="netIpVal">—</span></div>
    <div class="net-box net-port" id="netPort" role="button" tabindex="0" title="Copy port"><span class="net-label">Port</span><span class="net-val" id="netPortVal">—</span></div>
    <button type="button" class="net-copy" id="netCopy" title="Copy IP and port" aria-label="Copy IP and port">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
        <rect x="8.5" y="8.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="net-row">
    <div class="net-box net-id" id="netId" role="button" tabindex="0" title="Copy server ID"><span class="net-label">Server ID</span><span class="net-val" id="netIdVal">—</span></div>
  </div>
  <div class="net-status" id="netStatus"></div>
</div>
