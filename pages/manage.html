<div class="modal-overlay" id="confirmRemoveUserOverlay">
  <div class="modal-box" style="max-width:380px; text-align:center;">
    <h1 class="heading" style="justify-content:center;">Remove this user?</h1>
    <p class="subtext" id="confirmRemoveUserName" style="margin-bottom:24px;"></p>
    <p class="subtext" style="margin-bottom:24px; color: var(--error);">Removes their access to this server. Their login itself isn't deleted (they may have access to other servers). This cannot be undone.</p>
    <div style="display:flex; gap:12px;">
      <button type="button" class="signout" id="confirmRemoveUserCancel" style="flex:1;">Cancel</button>
      <button type="button" class="submit" id="confirmRemoveUserYes" style="flex:1; background: var(--error); color:#fff;">Yes, remove</button>
    </div>
  </div>
</div>

<!-- Manage Servers section: click a server to manage its users -->
<div class="manage-view" id="manageServersOverlay">
  <h1 class="heading" style="text-align:left; justify-content:flex-start;">Manage Servers</h1>
  <p class="subtext" style="text-align:left; margin-bottom:16px;">Click a server to see and manage its users.</p>

  <h2 class="adv-h">Backend link</h2>
  <div class="adv-search" style="margin-bottom:8px;">
    <input type="text" id="backendUrlInput" placeholder="https://your-backend-link" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="adv-ibtn ok" id="backendUrlBtn"><span>Save</span></button>
  </div>
  <div class="plg-status" id="backendUrlStatus" style="margin:0 0 18px;"></div>

  <div class="adv-search" style="margin-bottom:16px;">
    <input type="text" id="manageSearch" placeholder="Search servers…" autocomplete="off" spellcheck="false">
    <button type="button" class="adv-ibtn" id="manageSearchBtn" title="Search">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="manageServersBoxes" style="display:flex; flex-direction:column; gap:14px;"></div>
</div>

<div class="modal-overlay" id="srvInfoOverlay">
  <div class="modal-box" style="max-width:440px;">
    <button type="button" class="modal-close" id="srvInfoClose">✕</button>
    <h1 class="heading" style="text-align:left; justify-content:flex-start;" id="srvInfoTitle">Info</h1>
    <div id="srvInfoBody" style="display:flex; flex-direction:column; gap:8px; margin-top:16px;"></div>
  </div>
</div>
